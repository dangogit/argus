<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argus-icon-title argus-icon-desc" width="256" height="256" viewBox="0 0 256 256">
  <title id="argus-icon-title">Argus icon</title>
  <desc id="argus-icon-desc">Warm all-seeing aperture mark inspired by Argus Panoptes.</desc>
  <defs>
    <radialGradient id="argus-bg" cx="50%" cy="24%" r="82%">
      <stop offset="0" stop-color="#3c2a21"/>
      <stop offset=".58" stop-color="#1f1713"/>
      <stop offset="1" stop-color="#0f0b09"/>
    </radialGradient>
    <linearGradient id="argus-lid" x1="48" y1="82" x2="208" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f3ee"/>
      <stop offset=".5" stop-color="#d49a6a"/>
      <stop offset="1" stop-color="#c15f3c"/>
    </linearGradient>
    <radialGradient id="argus-iris" cx="42%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f8e4bf"/>
