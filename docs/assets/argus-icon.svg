  <rect width="256" height="256" rx="56" fill="url(#argus-bg)"/>
  <path d="M38 128c28-54 63-81 90-81s62 27 90 81c-28 54-63 81-90 81s-62-27-90-81Z" fill="#17120f" stroke="#5f4436" stroke-width="2"/>
  <path d="M55 128c23-31 49-46 73-46s50 15 73 46c-23 31-49 46-73 46s-50-15-73-46Z" fill="#f4f3ee"/>
  <path d="M55 128c23-31 49-46 73-46s50 15 73 46c-23 31-49 46-73 46s-50-15-73-46Z" fill="none" stroke="url(#argus-lid)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

