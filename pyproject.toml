[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-agent"
version = "0.2.0"
description = "Self-hosted company of AI agents for software projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Argus contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["psycopg[binary]>=3.1", "pydantic>=2.6", "PyYAML>=6.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dangogit/argus"
Repository = "https://github.com/dangogit/argus"
Documentation = "https://github.com/dangogit/argus/tree/main/docs"
Issues = "https://github.com/dangogit/argus/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7", "pytest-cov>=4"]

[project.scripts]
argus = "argus.v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"argus.v2.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "live: opt-in smoke tests against real external services (run with ARGUS_LIVE=1)",
]
