# sample-app: the example project Argus ships so a stranger has something to
# point at. Copy this folder to projects/<your-app>/ and edit. The seeded
# fixable bug and triage wiring arrive in the triage / sample-app plan; this
# manifest only declares the project's identity and the contract it targets.
name: sample-app
contract: 1.0.0
description: Example project for the Argus quickstart.
repo: null            # path to the project's git checkout, or null for the demo
triage:
  enabled: false      # turned on in the triage plan
autofix:
  mode: propose-only  # propose-only (default) | autonomous (explicit opt-in)
