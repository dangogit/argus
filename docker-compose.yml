name: argus

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - argus-postgres-data:/var/lib/postgresql/data

volumes:
  argus-postgres-data:
